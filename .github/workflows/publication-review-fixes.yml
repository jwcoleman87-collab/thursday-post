name: Verify publication review corrections
on:
  push:
    branches: [work/publication-draft-20260914]
    paths: [.github/workflows/publication-review-fixes.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: de0ecbe6791c8541ccdd29541f0181c6871dcfc7
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Load checksum-verified review regressions
        run: |
          cp transfer/.repair/review-regressions.ts source/tests/assessed-draft-review.test.ts
          test "$(git -C source hash-object tests/assessed-draft-review.test.ts)" = '5e7bd8cb20a2a7dd62efc222e06a994bbd5a84b7'
          test "$(git -C source hash-object src/lib/engine.ts)" = 'eb753901658463ef0bf004cb9860e0e20a19c0d2'
      - run: npm ci
        working-directory: source
      - name: Reproduce both review findings before correction
        working-directory: source
        run: |
          python3 - <<'PY'
          import subprocess
          p=subprocess.run(['npx','tsx','--test','tests/assessed-draft-review.test.ts'],capture_output=True,text=True)
          print(p.stdout);print(p.stderr)
          assert p.returncode!=0,'Regression unexpectedly passed against the reviewed defective revision'
          assert 'fail 2' in p.stdout and 'tests 2' in p.stdout,'Expected exactly the two reviewed regression failures'
          PY
      - name: Apply narrowly checked corrections
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('src/lib/engine.ts');s=p.read_text()
          old='const id = stableId("claim", `${story.id}|record_statement|${text}`);'
          new='const id = stableId("claim", `${story.id}|record_statement|${source.id}|${text}`);'
          assert s.count(old)==1;s=s.replace(old,new)
          old='  Object.assign(original, story);'
          new='  // Copy deletions as well as values: a changed adverse article must lose its old reply.\n  if (!story.rightOfReply) delete original.rightOfReply;\n  Object.assign(original, story);'
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          assert subprocess.check_output(['git','hash-object','src/lib/engine.ts'],text=True).strip()=='d3563b1585d7d18d8dd0cdae9c4d6da28e14e3a9'
          PY
      - run: npm run typecheck
        working-directory: source
      - run: npm test
        working-directory: source
      - run: npm run build
        working-directory: source
      - name: Preserve reviewed corrections on feature branch only
        working-directory: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/engine.ts tests/assessed-draft-review.test.ts
          git diff --cached --check
          git commit -m 'Preserve reply invalidation and exact selected-source identity'
          git push origin HEAD:refs/heads/fix/agent-reviewed-draft
          git rev-parse HEAD
