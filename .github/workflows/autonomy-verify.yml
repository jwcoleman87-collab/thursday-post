name: Verify autonomous newsroom
on:
  push:
    branches: [work/autonomous-newsroom-20260914]
    paths: [.github/workflows/autonomy-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: bc3415059e66125ddc9b59a9ef9f59eabc445ff0
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Apply isolated autonomous wiring
        run: |
          python3 transfer/.autonomy/apply.py
          python3 transfer/.autonomy/fixup.py
      - run: npm ci
        working-directory: source
      - run: npm run typecheck
        working-directory: source
      - run: npm test
        working-directory: source
      - run: npm run build
        working-directory: source
      - name: Save passing implementation on feature branch only
        working-directory: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs/AUTONOMOUS_NEWSROOM.md .env.example
          git diff --cached --check
          git commit -m 'Run researchers and independent PE writing and checking autonomously'
          git push origin HEAD:refs/heads/feat/autonomous-newsroom
      - name: Export applied source and verification summary
        if: always()
        run: |
          cd source
          git diff > /tmp/autonomy-applied.patch
          tar -czf /tmp/autonomy-work.tar.gz src tests docs/AUTONOMOUS_NEWSROOM.md .env.example package.json package-lock.json tsconfig.json next.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomous-work-checkpoint
          path: |
            /tmp/autonomy-applied.patch
            /tmp/autonomy-work.tar.gz
          retention-days: 3
