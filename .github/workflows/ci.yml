name: Verify Thursday Post
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: hash_integrity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hash_integrity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HASH_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/hash_integrity_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
